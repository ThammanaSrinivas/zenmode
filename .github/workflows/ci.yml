name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21, not 17: the Paparazzi Gradle plugin (2.0.0-alpha05) requires JVM 21+
      # at build-classpath-resolution time, confirmed via a failed CI run pinned
      # to 17. The app's own Kotlin/Java compileOptions still target 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # gradlew is gitignored in this repo (CLAUDE.md: "generated by Android
      # Studio on first sync") - install the exact Gradle version the wrapper
      # would have pinned (gradle/wrapper/gradle-wrapper.properties, untracked
      # locally) and invoke `gradle` directly instead of ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      # No zenmode_core_private sibling exists in this checkout, so
      # settings.gradle.kts falls back to core-mock automatically - this is
      # the intended open-source build path, see CLAUDE.md.
      - name: gradle check
        run: gradle :app:check --stacktrace
