name: CI

on:
  push:
  pull_request:

# Cancel a run when a newer commit lands on the same branch - this repo is
# public (unlimited free minutes) but there's no reason to let a stale
# run's result race a newer one to completion either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21, not 17: the Paparazzi Gradle plugin (2.0.0-alpha05) requires JVM 21+
      # at build-classpath-resolution time, confirmed via a failed CI run pinned
      # to 17. The app's own Kotlin/Java compileOptions still target 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # gradlew is gitignored in this repo (CLAUDE.md: "generated by Android
      # Studio on first sync") - install the exact Gradle version the wrapper
      # would have pinned (gradle/wrapper/gradle-wrapper.properties, untracked
      # locally) and invoke `gradle` directly instead of ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      # Architectural choke point: app/ must reach backends only through
      # ServiceLocator (core-api), never by importing Firebase/PostHog SDK
      # classes or declaring their dependencies directly - that split is what
      # keeps open-source builds buildable without core-private. Only
      # core-mock/core-private are allowed to touch those SDKs.
      #
      # scripts/*.sh are the single source of truth for this and the checks
      # below - also called by the pre-commit hook, the Claude Code
      # PostToolUse hook, and tests/guardrails/, so none of them can drift
      # out of sync with each other.
      - name: Check app/ boundary (no direct Firebase/PostHog)
        run: ./scripts/check-app-boundary.sh

      # SOURCE OF TRUTH: architectural choke points. ServiceLocator.kt and
      # ZenModeApp.kt's onCreate() are the two files an AI (or a human) needs
      # to read to understand the whole composite-build/backend-selection
      # story - keep the [WHAT]/[WHY]/[HOW]/[WHERE] tags in them so that
      # context is found by grep instead of requiring the private docs.
      - name: Check choke-point files carry WHAT/WHY/HOW/WHERE tags
        run: ./scripts/check-choke-point-tags.sh

      # 1000-line ceiling on source files - see scripts/check-line-limit.sh
      # for rationale (HomeScreen.kt is grandfathered there).
      - name: Check file line-count ceiling
        run: ./scripts/check-line-limit.sh

      # Guardrails that test themselves: plants a known-bad fixture, asserts
      # the checks above actually catch it, then asserts a clean pass.
      - name: Test guardrails
        run: ./tests/guardrails/run.sh

      # No zenmode_core_private sibling exists in this checkout, so
      # settings.gradle.kts falls back to core-mock automatically - this is
      # the intended open-source build path, see CLAUDE.md.
      - name: gradle check
        run: gradle :app:check --stacktrace
