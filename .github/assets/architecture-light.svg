<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d">
  <title id="t">ZenMode module architecture</title>
  <desc id="d">The app module compiles against core-api. core-mock and core-private both implement core-api. At build time settings.gradle.kts includes core-private when ../zenmode_core_private exists, otherwise core-mock. At run time ZenModeApp loads the chosen backend's AppInitializer with ServiceLoader, which fills ServiceLocator.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1F2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 21px; font-weight: 700; }
    .body  { font-size: 15px; }
    .small { font-size: 14px; fill: #57606A; }
    .label { font-size: 14px; font-weight: 600; fill: #57606A; }
    .card  { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.5; }
    .app   { fill: #007700; stroke: #004D00; stroke-width: 1.5; }
    .app-text { fill: #FFFFFF; }
    .api   { fill: #FFFFFF; stroke: #007700; stroke-width: 2; }
    .mock  { fill: #EAFBEA; stroke: #007700; stroke-width: 1.5; }
    .priv  { fill: #FFFFFF; stroke: #57606A; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge  { fill: none; stroke: #57606A; stroke-width: 2; }
    .head  { fill: #57606A; }
    .chip  { fill: #007700; }
    .chip-text { fill: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; }
    .note  { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <!-- app -->
  <rect x="20" y="140" width="240" height="150" rx="14" class="app"/>
  <text x="140" y="182" text-anchor="middle" class="title app-text mono">app</text>
  <text x="140" y="212" text-anchor="middle" class="body app-text">Jetpack Compose UI</text>
  <text x="140" y="236" text-anchor="middle" class="body app-text">ViewModels &amp; navigation</text>
  <text x="140" y="260" text-anchor="middle" class="body app-text">Launcher &amp; system services</text>

  <!-- app -> core-api -->
  <line x1="260" y1="215" x2="366" y2="215" class="edge" marker-end="url(#arrow)"/>
  <text x="314" y="203" text-anchor="middle" class="label">compiles</text>
  <text x="314" y="238" text-anchor="middle" class="label">against</text>

  <!-- core-api -->
  <rect x="370" y="90" width="250" height="250" rx="14" class="api"/>
  <text x="495" y="130" text-anchor="middle" class="title mono">core-api</text>
  <text x="495" y="156" text-anchor="middle" class="small">Contracts &amp; domain models</text>
  <line x1="400" y1="172" x2="590" y2="172" style="stroke:#D0D7DE;stroke-width:1"/>
  <text x="495" y="198" text-anchor="middle" class="body mono">AuthProvider</text>
  <text x="495" y="222" text-anchor="middle" class="body mono">FirestoreDataSource</text>
  <text x="495" y="246" text-anchor="middle" class="body mono">AnalyticsManager</text>
  <text x="495" y="270" text-anchor="middle" class="body mono">RemoteConfigProvider</text>
  <text x="495" y="294" text-anchor="middle" class="body mono">AppInitializer</text>
  <text x="495" y="318" text-anchor="middle" class="body mono">ServiceLocator</text>

  <!-- backends -> core-api (shared bus) -->
  <path d="M740,100 H716 V330 H740" class="edge"/>
  <line x1="716" y1="215" x2="624" y2="215" class="edge" marker-end="url(#arrow)"/>
  <text x="668" y="203" text-anchor="middle" class="label">implements</text>

  <!-- core-mock -->
  <rect x="740" y="20" width="240" height="160" rx="14" class="mock"/>
  <rect x="760" y="36" width="78" height="22" rx="11" class="chip"/>
  <text x="799" y="52" text-anchor="middle" class="chip-text">DEFAULT</text>
  <text x="760" y="88" class="title mono">core-mock</text>
  <text x="760" y="114" class="body">Open source, no keys needed</text>
  <text x="760" y="138" class="small">Instant "Mock User" sign-in</text>
  <text x="760" y="160" class="small">DB &amp; analytics logged locally</text>

  <!-- core-private -->
  <rect x="740" y="250" width="240" height="160" rx="14" class="priv"/>
  <rect x="760" y="266" width="112" height="22" rx="11" style="fill:none;stroke:#57606A;stroke-width:1.5"/>
  <text x="816" y="282" text-anchor="middle" class="label" style="font-size:12px;letter-spacing:0.8px">MAINTAINERS</text>
  <text x="760" y="318" class="title mono">core-private</text>
  <text x="760" y="344" class="body">Not in this repository</text>
  <text x="760" y="368" class="small">Firebase · PostHog</text>
  <text x="760" y="390" class="small">Production backend</text>

  <!-- how it is wired -->
  <rect x="20" y="440" width="960" height="84" rx="14" class="note"/>
  <text x="44" y="474" class="body"><tspan font-weight="700">Build time</tspan><tspan class="small" dx="10">settings.gradle.kts includes core-private if ../zenmode_core_private exists, otherwise core-mock.</tspan></text>
  <text x="44" y="504" class="body"><tspan font-weight="700">Run time</tspan><tspan class="small" dx="22">ZenModeApp finds the backend's AppInitializer with ServiceLoader, which fills ServiceLocator.</tspan></text>
</svg>
